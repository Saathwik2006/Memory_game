<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Match - 2 Player</title>

    <link rel="stylesheet" href="gamstyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="game-container">

        <!-- Header -->
        <header class="game-header">
            <h1>MEMORY <span>MATCH</span></h1>
            
        </header>


        <!-- Player Information -->
        <section class="players">

            <div class="player-card player-one active">
                <div class="player-icon">👤</div>

                <div class="player-info">
                    <h2>PLAYER 1</h2>
                    <span class="turn-label">YOUR TURN</span>
                </div>

                <div class="score">
                    <span>Score</span>
                    <strong id="score1">0</strong>
                </div>
            </div>


            <div class="vs">
                VS
            </div>


            <div class="player-card player-two">
                <div class="player-icon">👤</div>

                <div class="player-info">
                    <h2>PLAYER 2</h2>
                    <span class="turn-label">WAITING</span>
                </div>

                <div class="score">
                    <span>Score</span>
                    <strong id="score2">0</strong>
                </div>
            </div>

        </section>


        <!-- Game Status -->
        <div class="game-status">

            <div class="status-item">
                <span>TURN</span>
                <strong id="current-player">PLAYER 1</strong>
            </div>

            <div class="status-item">
                <span>FLIPS</span>
                <strong id="flip-count">0</strong>
            </div>

            <div class="status-item">
                <span>PAIRS</span>
                <strong id="pairs-found">0 / 8</strong>
            </div>

        </div>


        <!-- Game Board -->
        <main class="game-board" id="game-grid">

            <!-- Cards will be created by JavaScript -->

        </main>


        <!-- Controls -->
        <div class="controls">

            <button id="start-btn" class="game-btn start-btn">
                ▶ START GAME
            </button>

            <button id="restart-btn" class="game-btn restart-btn">
                ↻ RESTART
            </button>

        </div>


        <!-- Winner Popup -->
        <div class="winner-overlay" id="winner-overlay">

            <div class="winner-box">

                <div class="trophy">🏆</div>

                <h2 id="winner-title">PLAYER 1 WINS!</h2>

                <p id="winner-message">
                    Great memory!
                </p>

                <button id="play-again-btn" class="game-btn start-btn">
                    PLAY AGAIN
                </button>

            </div>

        </div>

    </div>


    <script src="gamecode.js"></script>

</body>
</html>
